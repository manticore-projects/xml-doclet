import org.gradle.util.GradleVersion

def minimumGradleVersion = GradleVersion.version("9.2")
if (GradleVersion.current() < minimumGradleVersion) {
    throw new GradleException("""
        This build requires Gradle ${minimumGradleVersion.version} or later, but is running on ${GradleVersion.current().version}.

        com.gradleup.shadow 9.5.0+ calls
            AdhocComponentWithVariants.addVariantsFromConfiguration(Provider, Action)
        which was only added in Gradle 9.2.0.

        Upgrade the wrapper:
            ./gradlew wrapper --gradle-version 9.7.1 --distribution-type bin

        Or pin an older Shadow in build.gradle:
            9.4.3 requires Gradle 9.0
            9.2.2 requires Gradle 8.11
        """.stripIndent())
}

rootProject.name = 'xml-doclet'
